<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cardlyo — Modern Spaced Repetition</title>
  
  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="A powerful, minimalist spaced repetition flashcard and quiz application." />
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Global Header -->
  <header class="site-header" role="banner">
    <a href="#" class="logo" onclick="event.preventDefault(); resetHome();" aria-label="Cardlyo Home">
      <img src="./icon-192.svg" class="logo-icon-img" alt="Cardlyo Logo" width="34" height="34" />
      <span>Cardlyo</span>
    </a>

    <div class="header-actions">
      <button class="btn btn-sm header-action-btn" type="button" onclick="triggerPasteImport()" title="Paste LexiRead JSON or cards from clipboard" aria-label="Paste Stack">
        <span class="header-btn-icon" aria-hidden="true">📋</span>
        <span class="header-btn-text" data-i18n="paste">Paste Stack</span>
      </button>

      <button class="btn btn-sm header-action-btn" type="button" onclick="openSettingsModal()" title="Settings" aria-label="Settings">
        <span class="header-btn-icon" aria-hidden="true">⚙️</span>
        <span class="header-btn-text" data-i18n="settings">Settings</span>
      </button>

      <input type="file" id="import-file" accept="application/json" style="display:none;" onchange="handleImportFile(this)" />
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="main-wrap" id="app-root" role="main"></main>

  <!-- Global Footer -->
  <footer class="site-footer">
    <p>Cardlyo • <span data-i18n="tagline">Spaced Repetition Reimagined</span></p>
  </footer>

  <!-- Modular Scripts -->
  <script src="./js/i18n.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/stack-detail.js"></script>
  <script src="./js/card-manage.js"></script>
  <script src="./js/flashcards.js"></script>
  <script src="./js/test-engine.js"></script>
  <script src="./js/typing-engine.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
