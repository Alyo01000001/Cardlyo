          <p>Delete this card permanently from the stack and Leitner boxes.</p>
          <div class="confirm-row" id="delete-confirm-row">
            <button type="button" class="btn btn-sm btn-danger" onclick="confirmCardDelete()">${t("delete")} Card</button>
          </div>
        </div>
      `, "manage-card-modal");
    }

    function saveCardEdits() {
      const stackId = document.getElementById("manage-stack-id").value;
      const cardId = document.getElementById("manage-card-id").value;
      const qInput = document.getElementById("manage-card-q");
      const aInput = document.getElementById("manage-card-a");

      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack) return;
      const card = stack.cards.find(c => c.id === cardId);
      if (!card) return;

      const q = qInput.value.trim();
      const a = aInput.value.trim();
      if (!q || !a) {
        showAlert("Both front and back are required.");
        return;
      }

      card.q = q;
      card.a = a;
      persistState();
      closeModal();
      openStackDetail(stackId);
      showToast(t("cardUpdated"));
    }

    function confirmCardDelete() {
      const stackId = document.getElementById("manage-stack-id").value;
      const cardId = document.getElementById("manage-card-id").value;
      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack) return;

      stack.cards = stack.cards.filter(c => c.id !== cardId);
      stack.correctBox = stack.correctBox.filter(id => id !== cardId);
      stack.wrongBox = stack.wrongBox.filter(id => id !== cardId);
      persistState();
      closeModal();
      openStackDetail(stackId);
      showToast(t("cardDeleted"));
    }

    // ============================================================
    // FLASHCARD REVIEW (WITH UNDO & TTS & KEYBOARD SHORTCUTS)
    // ============================================================
    let flashcardSession = null;
    let suppressFlashcardClick = false;

    function getReviewPool(stack, source) {
      if (source === "wrong") return stack.cards.filter(c => stack.wrongBox.includes(c.id));
      return stack.cards.slice();
    }

    function openWrongBoxReview(stackId) {
      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack || stack.wrongBox.length === 0) return;

      if (stack.wrongBox.length === 1) {
        openFlashcardOrderModal(stackId, "wrong");
        return;
      }

      showModal(t("reviewWrongCards"), `
        <p style="color:var(--fg-muted); line-height:1.55; margin-bottom:1.25rem;">
          ${stack.wrongBox.length} ${t("wrongCards").toLowerCase()}
        </p>
        <div style="display:grid; gap:0.7rem;">
          <button class="btn btn-primary" type="button" onclick="openTestConfigModal('${escapeHtml(stackId)}', 'wrong')">${t("testMode")}</button>
          <button class="btn" type="button" onclick="openFlashcardOrderModal('${escapeHtml(stackId)}', 'wrong')">${t("flashcardMode")}</button>
          <button class="btn" type="button" onclick="closeModal()">${t("cancel")}</button>
        </div>
      `);
    }

    function openFlashcardOrderModal(stackId, source = "all") {
      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack) return;
      const pool = getReviewPool(stack, source);
      if (pool.length === 0) {
        showAlert(t("minFlashcardError"));
        return;
      }

      showModal(t("configureFlashcards"), `
        <input type="hidden" id="session-stack-id" value="${escapeHtml(stackId)}" />
        <input type="hidden" id="session-source" value="${escapeHtml(source)}" />
        <label for="session-order">${t("order")}</label>
        <select id="session-order">
          <option value="sequential">${t("orderSeq")}</option>
          <option value="random">${t("orderRand")}</option>
        </select>
        <label for="session-face">${t("firstFace")}</label>
        <select id="session-face">
          <option value="front">${t("front")}</option>
          <option value="back">${t("back")}</option>
        </select>
        <div class="btn-row">
          <button class="btn" type="button" onclick="closeModal()">${t("cancel")}</button>
          <button class="btn btn-primary" type="button" onclick="confirmFlashcardConfig()">Start</button>
        </div>
      `);
    }

    function confirmFlashcardConfig() {
      const stackId = document.getElementById("session-stack-id").value;
      const source = document.getElementById("session-source").value;
      const order = document.getElementById("session-order").value;
      const face = document.getElementById("session-face").value;
      startFlashcardSession(stackId, order, source, face);
    }

    function shuffleCards(cards) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function startFlashcardSession(stackId, order, source = "all", face = "front") {
      const stack = state.stacks.find(s => s.id === stackId);
      const cards = stack ? getReviewPool(stack, source) : [];
      if (!stack || cards.length === 0) {
        showAlert(t("minFlashcardError"));
        return;
      }
      if (order === "random") shuffleCards(cards);
      closeModal();

      flashcardSession = {
        stackId,
        cards,
        index: 0,
        correct: 0,
        wrong: 0,
        locked: false,
        firstFace: face === "back" ? "back" : "front",
        undoHistory: []
      };
      renderFlashcardSession();
    }

    function renderFlashcardSession() {
      if (!flashcardSession) return;
      const root = document.getElementById("app-root");
      const currentCard = flashcardSession.cards[flashcardSession.index];
      const total = flashcardSession.cards.length;
      const startFlipped = flashcardSession.firstFace === "back";
      const hasUndo = flashcardSession.undoHistory.length > 0;

      root.innerHTML = `
        <section class="flashcard-overlay" aria-label="Flashcard review session">
          <div class="flashcard-session">
            <div class="flashcard-session-top">
              <span>Card ${flashcardSession.index + 1} / ${total}</span>
              <div class="flashcard-top-actions">
                ${hasUndo ? `<button class="btn btn-sm" type="button" onclick="undoFlashcardStep()">${t("undo")}</button>` : ""}
                <button class="btn btn-sm" type="button" onclick="finishFlashcardReview(true)">${t("exit")}</button>
              </div>
            </div>
            <div class="flashcard-scene">
              <button class="flashcard-surface${startFlipped ? " is-flipped" : ""}" id="flashcard-surface" type="button">
                <span class="flashcard-inner">
                  <span class="flashcard-face flashcard-front">
                    <div class="flashcard-face-header">
                      <span class="flashcard-face-label">${t("front")}</span>
                      <button type="button" class="flashcard-tts-btn" onclick="event.stopPropagation(); speakText('${escapeHtml(currentCard.q).replace(/'/g, "\\'")}')" title="Listen" aria-label="Listen front">🔊</button>
                    </div>
                    <span class="flashcard-face-text">${escapeHtml(currentCard.q)}</span>
                  </span>
                  <span class="flashcard-face flashcard-back">
                    <div class="flashcard-face-header">
                      <span class="flashcard-face-label">${t("back")}</span>
                      <button type="button" class="flashcard-tts-btn" onclick="event.stopPropagation(); speakText('${escapeHtml(currentCard.a).replace(/'/g, "\\'")}')" title="Listen" aria-label="Listen back">🔊</button>
                    </div>
                    <span class="flashcard-face-text">${escapeHtml(currentCard.a)}</span>
                  </span>
                </span>
              </button>
            </div>
            <p class="flashcard-hint">${t("flipHint")}</p>
            <div class="flashcard-actions">
              <button class="flashcard-decision flashcard-dont-know" id="flashcard-dont-know" type="button">${t("dontKnow")}</button>
              <button class="flashcard-decision flashcard-know" id="flashcard-know" type="button">${t("know")}</button>
            </div>
          </div>
        </section>
      `;

      const surface = document.getElementById("flashcard-surface");
      const dontKnowButton = document.getElementById("flashcard-dont-know");
      const knowButton = document.getElementById("flashcard-know");
      let touchStartX = null;

      surface.addEventListener("click", () => {
        if (!suppressFlashcardClick) flipFlashcard();
      });
      surface.addEventListener("touchstart", event => {
        touchStartX = event.changedTouches[0].clientX;
      }, { passive: true });
      surface.addEventListener("touchend", event => {
        if (touchStartX === null) return;
        const distance = event.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(distance) < 55) return;
        suppressFlashcardClick = true;
        handleFlashcardDecision(distance > 0);
        setTimeout(() => { suppressFlashcardClick = false; }, 450);
      }, { passive: true });

      dontKnowButton.addEventListener("click", () => handleFlashcardDecision(false));
      knowButton.addEventListener("click", () => handleFlashcardDecision(true));
    }

    function flipFlashcard() {
      if (!flashcardSession || flashcardSession.locked) return;
      const surface = document.getElementById("flashcard-surface");
      if (surface) surface.classList.toggle("is-flipped");
    }

    function routeCardToLeitner(stack, cardId, isCorrect) {
      stack.correctBox = stack.correctBox.filter(id => id !== cardId);
      stack.wrongBox = stack.wrongBox.filter(id => id !== cardId);
      if (isCorrect) stack.correctBox.push(cardId);
      else stack.wrongBox.push(cardId);
      persistState();
    }

    function handleFlashcardDecision(isCorrect) {
      if (!flashcardSession || flashcardSession.locked) return;
      const stack = state.stacks.find(s => s.id === flashcardSession.stackId);
      const currentCard = flashcardSession.cards[flashcardSession.index];
      const surface = document.getElementById("flashcard-surface");
      if (!stack || !currentCard || !surface) return;

      // Save previous state for UNDO
      flashcardSession.undoHistory.push({
        index: flashcardSession.index,
        cardId: currentCard.id,
        prevCorrectBox: [...stack.correctBox],
        prevWrongBox: [...stack.wrongBox],
        isCorrect
      });

      flashcardSession.locked = true;
      const dkBtn = document.getElementById("flashcard-dont-know");
      const kBtn = document.getElementById("flashcard-know");
      if (dkBtn) dkBtn.disabled = true;
      if (kBtn) kBtn.disabled = true;

      routeCardToLeitner(stack, currentCard.id, isCorrect);
      if (isCorrect) flashcardSession.correct++;
      else flashcardSession.wrong++;

      surface.classList.add(isCorrect ? "slide-right" : "slide-left");
      setTimeout(() => {
        if (!flashcardSession) return;
        flashcardSession.index++;
        if (flashcardSession.index >= flashcardSession.cards.length) {
          finishFlashcardReview(false);
        } else {
          flashcardSession.locked = false;
          renderFlashcardSession();
        }
      }, 360);
    }

    function undoFlashcardStep() {
      if (!flashcardSession || flashcardSession.undoHistory.length === 0) return;
      const last = flashcardSession.undoHistory.pop();
      const stack = state.stacks.find(s => s.id === flashcardSession.stackId);
      if (!stack) return;

      // Restore stack Leitner boxes
      stack.correctBox = last.prevCorrectBox;
      stack.wrongBox = last.prevWrongBox;
      persistState();

      if (last.isCorrect) flashcardSession.correct = Math.max(0, flashcardSession.correct - 1);
      else flashcardSession.wrong = Math.max(0, flashcardSession.wrong - 1);

      flashcardSession.index = last.index;
      flashcardSession.locked = false;
      renderFlashcardSession();
      showToast(t("undone"));
    }

    function finishFlashcardReview(cancelled) {
      if (!flashcardSession) return;
      const completed = flashcardSession;
      const root = document.getElementById("app-root");
      flashcardSession = null;

      if (cancelled) {
        openStackDetail(completed.stackId);
        return;
      }

      root.innerHTML = `
        <section class="flashcard-overlay" aria-label="Flashcard review summary">
          <div class="flashcard-session">
            <article class="flashcard-summary">
              <h2>${t("reviewComplete")}</h2>
              <p>${completed.correct} ${t("correctCards")}, ${completed.wrong} ${t("wrongCards")}</p>
              <button class="btn btn-primary" type="button" onclick="openStackDetail('${escapeHtml(completed.stackId)}')">${t("returnToStack")}</button>
            </article>
          </div>
        </section>
      `;
    }

    // ============================================================
    // TEST ENGINE (WITH KEYBOARD NUMBERS 1-4 & TTS)
    // ============================================================
    const MIN_TEST_CARDS = 2;
    const MAX_TEST_OPTIONS = 4;

    let activeTestStack = null;
    let activeTestPool = [];
    let activeTestIndex = 0;
    let activeTestScore = 0;
    let activeTestSource = "main";
    let activeTestFace = "front";

    function openTestConfigModal(stackId, source = "all") {
      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack) return;

      const pool = getReviewPool(stack, source);
      if (pool.length < MIN_TEST_CARDS) {
        showAlert(t("minCardsError"));
        return;
      }

      showModal(t("configureTest"), `
        <input type="hidden" id="session-stack-id" value="${escapeHtml(stackId)}" />
        <input type="hidden" id="session-source" value="${escapeHtml(source)}" />
        <label for="session-order">${t("order")}</label>
        <select id="session-order">
          <option value="sequential">${t("orderSeq")}</option>
          <option value="random">${t("orderRand")}</option>
        </select>
        <label for="session-face">${t("firstFace")}</label>
        <select id="session-face">
          <option value="front">${t("front")}</option>
          <option value="back">${t("back")}</option>
        </select>
        <div class="btn-row">
          <button class="btn" type="button" onclick="closeModal()">${t("cancel")}</button>
          <button class="btn btn-primary" type="button" onclick="confirmTestConfig()">Start</button>
        </div>
      `);
    }

    function confirmTestConfig() {
      const stackId = document.getElementById("session-stack-id").value;
      const source = document.getElementById("session-source").value;
      const order = document.getElementById("session-order").value;
      const face = document.getElementById("session-face").value;

      const stack = state.stacks.find(s => s.id === stackId);
      if (!stack) { closeModal(); return; }

      let pool = getReviewPool(stack, source);
      if (pool.length < MIN_TEST_CARDS) {
        closeModal();
        showAlert(t("minCardsError"));
        return;
      }
      if (order === "random") pool = shuffleCards(pool.slice());

      runTestSession(stack, pool, source === "wrong" ? "wrongBox" : "main", face);
    }

    function runTestSession(stack, pool, source, face = "front") {
      closeModal();
      activeTestStack = stack;
      activeTestPool = pool.map(c => ({ ...c }));
      activeTestSource = source;
      activeTestFace = face === "back" ? "back" : "front";
      activeTestIndex = 0;
      activeTestScore = 0;
      renderTestUI();
    }

    function exitTest() {
      const stackId = activeTestStack ? activeTestStack.id : "";
      activeTestStack = null;
      activeTestPool = [];
      activeTestIndex = 0;
      activeTestScore = 0;
      if (stackId) openStackDetail(stackId);
      else renderApp();
    }

    function renderTestUI() {
      const root = document.getElementById("app-root");
      root.innerHTML = "";

      const overlay = document.createElement("section");
      overlay.className = "test-overlay";
      overlay.setAttribute("aria-label", "Test session");
      overlay.innerHTML = `
        <article class="test-card" aria-live="polite" aria-atomic="true">
          <div class="test-exit-row">
            <button class="btn btn-sm" type="button" onclick="exitTest()">${t("exit")}</button>
          </div>
          <div class="test-progress" aria-label="Progress">
            <span>Q ${activeTestIndex + 1} / ${activeTestPool.length}</span>
            <div class="test-progress-bar">
              <div class="test-progress-fill" style="width: ${((activeTestIndex) / activeTestPool.length) * 100}%"></div>
            </div>
          </div>
          <div class="test-q-row">
            <h2 class="test-question" id="test-q"></h2>
            <button type="button" class="btn-icon" id="test-tts-btn" title="Listen question">🔊</button>
          </div>
          <div class="test-options" id="test-options" role="radiogroup"></div>
        </article>
      `;
      root.appendChild(overlay);

      const questionField = activeTestFace === "back" ? "a" : "q";
      const optionField = activeTestFace === "back" ? "q" : "a";
      const currentCard = activeTestPool[activeTestIndex];

      overlay.querySelector("#test-q").textContent = currentCard[questionField];
      overlay.querySelector("#test-tts-btn").onclick = () => speakText(currentCard[questionField]);

      const distractorPool = activeTestPool.filter(c => c.id !== currentCard.id);
      const optionCount = Math.min(MAX_TEST_OPTIONS, activeTestPool.length);
      const distractors = [];
      while (distractors.length < optionCount - 1 && distractorPool.length > 0) {
        const idx = Math.floor(Math.random() * distractorPool.length);
        distractors.push(distractorPool.splice(idx, 1)[0]);
      }

      const options = [currentCard, ...distractors];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      const optionsContainer = overlay.querySelector("#test-options");
      options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "test-option-btn";
        btn.dataset.cardId = opt.id;
        btn.dataset.optionIdx = idx + 1;
        btn.innerHTML = `
          <span>${escapeHtml(opt[optionField])}</span>
          <span class="test-key-tag">${idx + 1}</span>
        `;
        btn.onclick = () => handleTestAnswer(opt.id === currentCard.id, opt.id);
        optionsContainer.appendChild(btn);
      });
    }

    function handleTestAnswer(isCorrect, chosenId) {
      const overlay = document.querySelector(".test-overlay");
      if (!overlay) return;
      const btns = overlay.querySelectorAll(".test-option-btn");
      const currentCard = activeTestPool[activeTestIndex];

      btns.forEach(b => {
        b.disabled = true;
        if (b.dataset.cardId === currentCard.id) b.classList.add("correct-guess");
        else if (b.dataset.cardId === chosenId) b.classList.add("wrong-guess");
      });

      routeCardToLeitner(activeTestStack, currentCard.id, isCorrect);
      if (isCorrect) activeTestScore++;

      setTimeout(() => {
        if (!activeTestStack) return;
        activeTestIndex++;
        if (activeTestIndex >= activeTestPool.length) {
          showTestResults();
        } else {
          renderTestUI();
        }
      }, 750);
    }

    function showTestResults() {
      const completedStackId = activeTestStack ? activeTestStack.id : "";
      const total = activeTestPool.length;
      const restartSource = activeTestSource === "wrongBox" ? "wrong" : "all";
      const root = document.getElementById("app-root");
      root.innerHTML = "";
      const overlay = document.createElement("section");
      overlay.className = "test-overlay";
      overlay.innerHTML = `
        <article class="test-card test-results">
          <h3>${t("sessionComplete")}</h3>
          <div class="score-ring">${activeTestScore} / ${total}</div>
          <p>${activeTestScore} / ${total} correct</p>
          <div style="display:flex; gap:0.75rem; justify-content:center;">
            <button class="btn btn-primary" onclick="openStackDetail('${escapeHtml(completedStackId)}')">${t("returnToStack")}</button>
            <button class="btn" onclick="openTestConfigModal('${escapeHtml(completedStackId)}', '${restartSource}')">${t("restartTest")}</button>
          </div>
        </article>
      `;
      root.appendChild(overlay);
      activeTestStack = null;
      activeTestPool = [];
    }

    // ============================================================
    // GLOBAL KEYBOARD SHORTCUTS CONTROLLER
    // ============================================================
    document.addEventListener("keydown", (e) => {
      const targetTag = e.target.tagName ? e.target.tagName.toLowerCase() : "";
      const isInput = targetTag === "input" || targetTag === "textarea" || targetTag === "select";

      // ESCAPE key handler
      if (e.key === "Escape") {
        if (currentModalBack) {
          closeModal();
          return;
        }
        if (flashcardSession) {
          finishFlashcardReview(true);
          return;
        }
        if (activeTestStack) {
          exitTest();
          return;
        }
      }

      if (isInput) return; // don't trigger game keys while typing

      // Flashcard shortcuts
      if (flashcardSession && !flashcardSession.locked) {
        if (e.code === "Space") {
          e.preventDefault();
          flipFlashcard();
        } else if (e.key === "ArrowRight" || e.key === "2" || e.code === "KeyD") {
          e.preventDefault();
          handleFlashcardDecision(true);
        } else if (e.key === "ArrowLeft" || e.key === "1" || e.code === "KeyA") {
          e.preventDefault();
          handleFlashcardDecision(false);
        } else if (e.key === "z" || e.key === "Z") {
          e.preventDefault();
          undoFlashcardStep();
        }
      }

      // Test Mode shortcuts (1, 2, 3, 4)
      if (activeTestStack) {
        if (["1", "2", "3", "4"].includes(e.key)) {
          const btn = document.querySelector(`.test-option-btn[data-option-idx="${e.key}"]:not(:disabled)`);
          if (btn) {
            e.preventDefault();
            btn.click();
          }
        }
      }
    });

    // ============================================================
    // MODAL & ALERTS
    // ============================================================
    let currentModalBack = null;
    function showModal(title, htmlContent, modalClass = "") {
      closeModal();
      currentModalBack = document.createElement("section");
      currentModalBack.className = "modal-backdrop";
      currentModalBack.setAttribute("role", "dialog");
      currentModalBack.setAttribute("aria-modal", "true");
      currentModalBack.innerHTML = `
        <div class="modal ${escapeHtml(modalClass)}" role="document">
          <h2>${escapeHtml(title)}</h2>
          <div>${htmlContent}</div>
        </div>
      `;
      document.body.appendChild(currentModalBack);
      setTimeout(() => {
        if (!currentModalBack) return;
        const input = currentModalBack.querySelector("input:not([type='hidden']), textarea");
        if (input) input.focus();
      }, 50);
    }

    function closeModal() {
      if (currentModalBack) { currentModalBack.remove(); currentModalBack = null; }
    }

    function showAlert(message) {
      const modalBack = document.createElement("section");
      modalBack.className = "modal-backdrop";
      modalBack.innerHTML = `
        <div class="alert-modal" role="document">
          <h3>Alert</h3>
          <p>${escapeHtml(message)}</p>
          <button class="btn btn-primary" onclick="this.closest('.modal-backdrop').remove()" style="margin-top:1.25rem;">OK</button>
        </div>
      `;
      document.body.appendChild(modalBack);
    }

    function showToast(message) {
      const existing = document.getElementById("app-toast");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.id = "app-toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => toast.classList.add("visible"));
      });
      setTimeout(() => {
        toast.classList.remove("visible");
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // ============================================================
    // STATE EXPORT & IMPORT (JSON)
    // ============================================================
    function triggerImport() {
      document.getElementById("import-file").click();
    }

    function handleImportFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.stacks || !Array.isArray(parsed.stacks)) {
            showAlert("Invalid JSON file: missing 'stacks' array.");
            return;
          }
          const migrated = migrateState(parsed);
          state.stacks = migrated.stacks;
          state.libraries = migrated.libraries;
          persistState();
          renderApp();
          showToast(t("upload") + " OK");
        } catch (err) {
          showAlert("Failed to parse JSON file: " + err.message);
        }
        input.value = "";
      };
      reader.readAsText(file);
    }

    function triggerDownload() {
      const blob = new Blob([JSON.stringify({ stacks: state.stacks, libraries: state.libraries }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cardlyo_save.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function resetHome() {
      dashboardSearchQuery = "";
      renderApp();
    }

    // ============================================================
    // PWA SERVICE WORKER REGISTRATION
    // ============================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    initTheme();
    loadPersistedState();
    renderApp();
