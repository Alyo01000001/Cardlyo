<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cardlyo — Modern Spaced Repetition</title>
  
  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="A powerful, minimalist spaced repetition flashcard and quiz application." />
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Global Header -->
  <header class="site-header" role="banner">
    <a href="#" class="logo" onclick="event.preventDefault(); resetHome();" aria-label="Cardlyo Home">
      <img src="./icon-192.svg" class="logo-icon-img" alt="Cardlyo Logo" width="34" height="34" />
      <span>Cardlyo</span>
    </a>

    <div class="header-actions">
      <button class="btn btn-sm" type="button" onclick="triggerPasteImport()" title="Paste LexiRead JSON or cards from clipboard">
        <span aria-hidden="true">📋</span> <span data-i18n="paste">Paste Stack</span>
      </button>

      <button class="btn btn-sm" type="button" onclick="triggerImport()" title="Import Cardlyo JSON">
        <span aria-hidden="true">↑</span> <span data-i18n="upload">Upload</span>
      </button>
      <input type="file" id="import-file" accept="application/json" style="display:none;" onchange="handleImportFile(this)" />

      <button class="btn btn-sm" type="button" onclick="triggerDownload()" title="Download Full Backup">
        <span aria-hidden="true">↓</span> <span data-i18n="download">Download</span>
      </button>

      <button class="btn btn-sm" type="button" onclick="toggleLanguage()" title="Switch Language">
        <span aria-hidden="true">🌐</span> <span id="lang-label">TR</span>
      </button>

      <button class="btn btn-sm" type="button" onclick="toggleTheme()" aria-label="Toggle Theme">
        <span id="theme-icon" aria-hidden="true">◑</span> <span id="theme-label" data-i18n="theme">Dark</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="main-wrap" id="app-root" role="main"></main>

  <!-- Global Footer -->
  <footer class="site-footer">
    <p>Cardlyo • <span data-i18n="tagline">Spaced Repetition Reimagined</span></p>
  </footer>

  <!-- Modular Scripts -->
  <script src="./js/i18n.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/stack-detail.js"></script>
  <script src="./js/card-manage.js"></script>
  <script src="./js/flashcards.js"></script>
  <script src="./js/test-engine.js"></script>
  <script src="./js/typing-engine.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
